<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>할머니의 타임캡슐</title>
<meta name="description" content="사회 6-2 2단원 ② 우리나라의 경제 성장 9~11차시 · 학습지 3~6쪽 혼자 공부 시간 여행">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='55' r='40' fill='%23e9b949'/%3E%3Ccircle cx='50' cy='55' r='31' fill='%23fffbea'/%3E%3Cpath d='M50 55V32M50 55h14' stroke='%237a3b2e' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6efe2;--paper:#fffdf7;--ink:#2d2a26;--sub:#6b6359;--line:#e3d8c4;--brand:#2f6fb3;--brand2:#245a93;--sun:#f2b134;--good:#1f9a74;--bad:#d2493a;--red:#d22b2b;--card:#ffffff;--shadow:0 2px 0 rgba(0,0,0,.06),0 6px 18px rgba(60,40,10,.08)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Noto Sans KR",system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3,.ttl,.era,.btn,.nn,.big-num{font-family:"Jua","Gowun Dodum",system-ui,sans-serif;font-weight:400}
h1{font-size:1.9rem;margin:.2em 0}h2{font-size:1.35rem;margin:.2em 0 .5em}h3{font-size:1.15rem;margin:.6em 0 .3em}
button{font:inherit;color:inherit}
.note{color:var(--sub);font-size:.92rem}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:6px 14px;background:#2b3a55;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#top .me{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:0;border-radius:12px;padding:2px 10px 2px 4px;cursor:pointer;color:#fff}
#top .me svg{background:#e8eefb;border-radius:8px}
.ttl{font-size:1.25rem;line-height:1.1;flex:1;min-width:0}.ttl small{display:block;font-family:"Gowun Dodum",sans-serif;font-size:.75rem;opacity:.75}
.tbtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pc{background:rgba(255,255,255,.12);border-radius:999px;padding:2px 10px;font-size:.9rem;white-space:nowrap}
.tb{background:#f2b134;color:#3a2a00;border:0;border-radius:10px;padding:6px 12px;cursor:pointer;font-size:.92rem;white-space:nowrap}
#view{max-width:1000px;margin:0 auto;padding:14px 16px 90px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--brand);color:#fff;border:0;border-radius:14px;padding:10px 18px;font-size:1.08rem;cursor:pointer;box-shadow:0 3px 0 var(--brand2);margin:6px 6px 6px 0;min-height:46px}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--brand2)}
.btn:disabled{background:#b8c2cc;box-shadow:0 3px 0 #9aa5b0;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--brand2);box-shadow:0 3px 0 #c8d4e2;border:2px solid #c8d4e2}
.btn.sun{background:var(--sun);color:#3a2a00;box-shadow:0 3px 0 #c48a17}
.btn.sm{font-size:.95rem;padding:6px 12px;min-height:38px}
.btn.big{font-size:1.25rem;padding:12px 26px}
.btn.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 3px 0 var(--brand2),0 0 0 0 rgba(47,111,179,.5)}50%{box-shadow:0 3px 0 var(--brand2),0 0 0 10px rgba(47,111,179,0)}}
.card{background:var(--card);border-radius:18px;padding:16px 18px;margin:12px 0;box-shadow:var(--shadow);border:1px solid var(--line)}
.box{background:#f4f7fb;border-radius:12px;padding:10px 14px;margin:10px 0;border:1px solid #dde6f0}
.box.sunny{background:#fff6dc;border-color:#f3d98a}.box.red{background:#fff0ee;border-color:#f3b7ae}
.list{margin:.3em 0;padding-left:1.2em}.list li{margin:.2em 0}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}
input[type=text],input:not([type]),input[inputmode],textarea{font:inherit;font-size:1.1rem;color:#1d1b18;-webkit-text-fill-color:#1d1b18;caret-color:#1d1b18;background:#fff;border:2px solid #c9bfae;border-radius:12px;padding:10px 12px;width:100%}
input:focus,textarea:focus{outline:3px solid #9cc4ee;border-color:var(--brand)}
textarea{min-height:76px;resize:vertical;margin:4px 0 8px}
button:focus-visible{outline:3px solid #ff9d00;outline-offset:2px}
/* 시작 */
.hero{position:relative;border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}.hero .scn{display:block;width:100%;height:240px}
.herot{position:absolute;left:18px;top:14px;background:rgba(255,253,247,.88);padding:8px 16px;border-radius:14px}.herot p{margin:0}
.who{display:flex;gap:12px;flex-wrap:wrap}.who label{flex:1;min-width:160px;font-weight:700}
.who label:first-child{flex:0 0 120px;min-width:100px}
.avmk{display:flex;gap:16px;align-items:center;margin:12px 0;flex-wrap:wrap}.avbig{background:#e8eefb;border-radius:16px;padding:6px 12px}
.opt{display:flex;align-items:center;gap:10px;margin:6px 0}.opt>span{width:78px;font-size:.95rem}.opt>div{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #cfc5b3;cursor:pointer;font-size:.8rem;background:#fff}
.opt .sw:not([style]){width:auto;border-radius:10px;padding:0 10px}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--brand)}
/* 지도 */
.mhead p{margin:.2em 0 0}.mgrid{display:grid;grid-template-columns:1fr 300px;gap:16px;margin-top:10px}
.road{display:flex;flex-direction:column;gap:8px}
.ses{font-family:"Jua",sans-serif;color:#8a6a45;margin:8px 0 0 6px;font-size:1.05rem}
.node{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px;cursor:pointer;box-shadow:var(--shadow)}
.node .nn{flex:0 0 64px;height:64px;border-radius:50%;background:#e8eefb;display:flex;align-items:center;justify-content:center;font-size:1.05rem;color:var(--brand2)}
.node .nt{flex:1;display:flex;flex-direction:column;line-height:1.35}.node .nt b{font-size:1.12rem}.node .nt small{color:var(--sub)}.node .pg{color:#8a6a45!important}
.node .ns{font-family:"Jua",sans-serif;white-space:nowrap}
.node.done{border-color:#9ed3bf}.node.done .nn{background:#d8f2e8;color:var(--good)}
.node.now{border-color:var(--sun);box-shadow:0 0 0 3px #ffe29a,var(--shadow)}.node.now .nn{background:var(--sun);color:#3a2a00}
.node.lock{opacity:.55}
.side .card.mini{padding:12px 14px}.tmini{width:120px;height:170px;display:block;margin:0 auto}
.letter .paperl{background:#fbf3df;border:1px dashed #c9b27f;border-radius:10px;padding:8px 12px;font-size:.95rem}
.letter.mini .paperl{font-size:.82rem;max-height:260px;overflow:auto}
.paperl p{margin:.35em 0}.paperl p.y{color:#4a3a20}.paperl .torn{display:inline-block;color:#b9a77f;border-bottom:2px dashed #d9c79f}
.paperl .sign{text-align:right;font-style:italic;color:#7a5537}
/* 장 화면 */
.scene{position:relative;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);background:#ccc}
.scene .scn{display:block;width:100%;height:230px}
.era{position:absolute;left:14px;top:12px;background:rgba(255,253,247,.92);border-radius:14px;padding:6px 14px;font-size:1.25rem;line-height:1.25;max-width:70%}
.era b{color:#c25b3f}.era small{display:block;font-family:"Gowun Dodum",sans-serif;font-size:.85rem;color:var(--sub)}
.tags{position:absolute;left:14px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap}.tags span{background:rgba(43,58,85,.88);color:#fff;border-radius:999px;padding:2px 12px;font-size:.9rem}
.guide{margin:12px 0 0}
.nowdo{display:flex;gap:10px;align-items:center;background:#fff6dc;border:2px solid #f3d98a;border-radius:14px;padding:10px 14px;font-size:1.12rem}
.nowdo .lb{flex:0 0 auto;background:var(--sun);color:#3a2a00;font-family:"Jua",sans-serif;border-radius:10px;padding:2px 10px}
.chips{list-style:none;display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:8px 0 0}
.chips button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px;font-size:.88rem;cursor:pointer;color:var(--sub)}
.chips button.ok{border-color:#9ed3bf;color:var(--good);background:#effaf5}
.chips button.cur{border-color:var(--brand);background:var(--brand);color:#fff}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:14px 0 8px}
.nav #bHelp{margin-left:auto;margin-right:auto}
/* 이야기 */
.talk{display:flex;gap:14px;align-items:flex-start}.talk .pf{flex:0 0 92px}
.bub{position:relative;flex:1;background:#f4f7fb;border:2px solid #dde6f0;border-radius:16px;padding:10px 16px;min-height:104px}
.bub:before{content:"";position:absolute;left:-12px;top:26px;border:10px solid transparent;border-right-color:#dde6f0}
.talk.tt .bub{background:#fff6dc;border-color:#f3d98a}.talk.tt .bub:before{border-right-color:#f3d98a}
.bub .nm small{color:var(--sub);margin-left:4px}.bub .tx{font-size:1.15rem;margin-top:4px;white-space:pre-wrap}
.log{margin-top:6px}.log summary{cursor:pointer;color:var(--sub);font-size:.92rem}.log p{margin:.3em 0;font-size:.95rem}
/* 캡슐 */
.caps{text-align:center}.capbox{background:none;border:0;cursor:pointer;display:inline-flex;flex-direction:column;align-items:center}
.capbox span{font-family:"Jua",sans-serif;color:var(--brand2)}
.capbox .lid{transform-origin:14px 30px;transition:transform .7s}.caps.open .lid{transform:rotate(-38deg) translate(-6px,-10px)}.caps.open .capbox span{visibility:hidden}
.letters{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px;text-align:left}
.lt{background:#fbf3df;border:1px solid #e3cf9f;border-radius:12px;padding:10px 12px;animation:fly .6s both}
.lt.torn{background:#fff0ee;border:2px dashed #e08a7c;animation:fly .6s both,shake .5s 1s}
.pair{display:flex;gap:4px}.pair img{width:50%;border-radius:6px;display:block}
@keyframes fly{from{opacity:0;transform:translateY(30px) rotate(-4deg)}to{opacity:1;transform:none}}
.big-num{font-size:1.8rem;color:#c25b3f;line-height:1.2}
/* 읽기 */
.readhd{display:flex;gap:12px;align-items:center;background:#eef5ff;border:2px solid #c7dbf3;border-radius:14px;padding:10px 14px;margin-bottom:6px}
.readhd .bk{font-size:2.2rem}.readhd small{display:block;color:var(--sub)}.readhd b{font-family:"Jua",sans-serif;font-size:1.6rem;color:var(--brand2)}
.readhd.ws{background:#fff4e8;border-color:#f1cfa6}.readhd.ws b{color:#b25c14}
.look{display:flex;flex-direction:column;gap:6px;margin:6px 0 8px}
.lk{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;font-size:1.02rem}
.lk .ck{flex:0 0 26px;height:26px;border-radius:8px;border:2px solid #b9ad97;display:flex;align-items:center;justify-content:center}
.lk[aria-pressed=true]{border-color:#9ed3bf;background:#effaf5}.lk[aria-pressed=true] .ck{background:var(--good);border-color:var(--good)}.lk[aria-pressed=true] .ck:after{content:"✓";color:#fff;font-weight:700}
.qh{color:var(--brand2)}
.qz{margin:6px 0 10px}.q{font-size:1.12rem;font-weight:700;margin:.3em 0}
.opts{display:grid;gap:8px;grid-template-columns:1fr}.opts.g2{grid-template-columns:1fr 1fr}
.opt{background:#fff;border:2px solid #cdd9e4;border-radius:12px;padding:10px 14px;text-align:left;cursor:pointer;font-size:1.06rem;min-height:48px}
.opts .opt:hover:not(:disabled){border-color:var(--brand)}
.opt[aria-pressed=true]{border-color:var(--brand);background:#e8f1fb}
.opt.right{border-color:var(--good);background:#e3f6ee;color:#145c46;font-weight:700}
.opt.no{border-color:#f0a99e;background:#fff0ee;color:#9a3125;text-decoration:line-through}
.opt:disabled{cursor:default}
.fb{margin-top:6px;min-height:1.4em}.good{color:var(--good);font-weight:700}.bad{color:var(--bad);font-weight:700}
/* 카드 맞추기 */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.mcard{background:#fffaf0;border:2px solid #e8d4a8;border-radius:12px;padding:10px;text-align:left;cursor:pointer;font-size:.98rem;min-height:84px}
.mcard[aria-pressed=true]{border-color:var(--brand);background:#e8f1fb;box-shadow:0 0 0 3px #b7d3f3}
.mcard.placed{visibility:hidden}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{background:#f4f7fb;border:2px dashed #9fb6cf;border-radius:14px;padding:10px;text-align:left;cursor:pointer;min-height:110px;display:flex;flex-direction:column;gap:4px}
.slot b{font-family:"Jua",sans-serif;font-size:1.15rem;color:var(--brand2)}.slot span{font-size:.92rem;color:var(--sub)}
.slot.full{border-style:solid;border-color:var(--good);background:#effaf5}.slot.full span{color:var(--ink)}
.scale{text-align:center}.scale svg{max-width:100%;height:auto}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
/* 나누기 */
.sort{display:flex;flex-direction:column;gap:8px}
.sort .it{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.sort .it button{border:2px solid #cdd9e4;background:#fff;border-radius:10px;padding:6px 10px;cursor:pointer;font-size:.95rem}
.sort .it.ok{border-color:#9ed3bf;background:#effaf5}.sort .it button.pick{background:var(--good);border-color:var(--good);color:#fff}
.sort .it.no{animation:shake .4s}
/* 토론 */
.dstep{border-top:2px dashed var(--line);margin-top:10px;padding-top:6px}
.roles{display:flex;gap:8px;flex-wrap:wrap}.role{border:2px solid #cdd9e4;background:#fff;border-radius:12px;padding:8px 18px;cursor:pointer;font-size:1.08rem;font-family:"Jua",sans-serif}
.role[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.quote{background:#f4f7fb;border-left:5px solid var(--brand);border-radius:8px;padding:8px 12px;margin:8px 0}
.quote.rb{border-left-color:var(--bad);background:#fff0ee}.quote.fx{border-left-color:var(--good);background:#effaf5}
.mycard{background:#fffdf0;border:2px solid #e8cf7a;border-radius:14px;padding:10px 14px;margin:8px 0}
.mycard>b{font-family:"Jua",sans-serif;font-size:1.15rem;display:block;margin-bottom:4px}.mycard div{margin:.25em 0}.mycard i{font-style:normal;color:#8a6a45;font-weight:700;margin-right:4px}
/* OX */
.binrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.bn{width:62px;height:62px;border-radius:12px 12px 8px 8px;border:2px solid #b9ad97;background:#efe6d3;cursor:pointer;font-family:"Jua",sans-serif;font-size:1.3rem;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.bn small{font-size:.85rem;color:var(--sub)}.bn.cur{border-color:var(--brand);box-shadow:0 0 0 3px #b7d3f3}.bn.ok{background:#d8f2e8;border-color:#9ed3bf}
.oxcard{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px}.oxcard p{font-size:1.2rem;font-weight:700;margin:.3em 0 .6em}
.oxz{display:flex;gap:10px}.oxz button{flex:1;border:3px solid;border-radius:14px;padding:8px;font-family:"Jua",sans-serif;font-size:2rem;cursor:pointer;background:#fff;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.oxz small{font-size:.9rem;font-family:"Gowun Dodum",sans-serif}
.oxz .o{border-color:#3d8fd6;color:#2a6aa8}.oxz .x{border-color:#e06a5a;color:#b8412f}
.oxz button.pick{color:#fff}.oxz .o.pick{background:#3d8fd6}.oxz .x.pick{background:#e06a5a}.oxz button:disabled:not(.pick){opacity:.4}
.bannerw{margin-top:10px}.banner{display:flex;gap:6px;flex-wrap:wrap;background:#2d6a4f;border-radius:10px;padding:10px;justify-content:center}
.banner span{background:#fff;border-radius:6px;padding:4px 12px;font-family:"Jua",sans-serif;font-size:1.2rem;color:#999;min-width:60px;text-align:center}.banner span.y{color:#2d6a4f}
/* 낱말 */
.wph{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:10px;font-size:.92rem}
.wph span{border-radius:999px;padding:2px 10px;background:#eee;color:var(--sub)}.wph span.cur{background:var(--brand);color:#fff}.wph span.ok{background:#d8f2e8;color:var(--good)}
.wph i{color:#bbb;font-style:normal}.wph .left{margin-left:auto;color:var(--sub);font-weight:400}
.wq{background:#fbf8ff;border:2px solid #d9cdf0;border-radius:16px;padding:12px 16px}
.wq>small{color:#6b4fa3;font-weight:700}
.def{font-size:1.25rem;margin:.3em 0 .7em;line-height:1.55}.def.sit{background:#fff;border-radius:10px;padding:8px 12px;border:1px solid #e3d8f5}
.wr{display:flex;gap:8px;align-items:center}.wr input{flex:1}.wr .btn{margin:0}
.hint{color:#6b4fa3;margin:4px 0 8px;min-height:1.2em}.hint b{font-size:1.3rem;letter-spacing:.12em}.hint .rev{color:var(--red);letter-spacing:0}
.wfb{margin-top:10px;border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.wfb.good{background:#e3f6ee}.wfb.bad{background:#fff0ee}.wfb .btn{margin-top:6px}
.fbw{margin-top:6px}
.phase-go{text-align:center;padding:14px;background:#fff6dc;border-radius:16px}.phase-go .big{font-size:2.6rem}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:8px 0}
.wc2{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px}.wc2 b{font-family:"Jua",sans-serif;font-size:1.1rem;margin-right:6px}.wc2 p{margin:.2em 0 0;font-size:.9rem;color:var(--sub)}
.wc2.gold{border-color:#e9b949;background:#fffaf0}
.stars{color:#e9a400;letter-spacing:1px}.stars i{color:#ddd;font-style:normal}
.wgroup h3{margin-bottom:0}
/* 학습지 */
.where{font-weight:700;color:#b25c14;margin:.2em 0 .5em}
.paper{background:#fff;border:2px solid #d9cdb7;border-radius:10px;overflow:hidden;background-image:linear-gradient(#fff,#fff)}
.wrow{display:grid;grid-template-columns:170px 1fr;border-bottom:1px solid #e6dccb}.wrow:last-child{border-bottom:0}
.wl{background:#f7f1e3;padding:8px 10px;font-weight:700;font-size:.95rem;color:#6b5434}.wt{padding:8px 12px;font-size:1.08rem;line-height:2}
.bl{display:inline-block;min-width:4.2em;border-bottom:2px solid #6b5434;text-align:center;padding:0 6px;margin:0 2px;line-height:1.5}
.bl i{font-style:normal;color:#9b927f}.bl b{display:none;color:var(--red)}
.paper.rev .bl i{display:none}.paper.rev .bl b{display:inline}
.redt{color:var(--red);font-weight:700}
.wsteps{margin-top:8px}
/* 조각 */
.pc-hd{display:flex;gap:12px;align-items:center}.pc-hd .pcs{font-size:2.6rem}.pc-hd.new .pcs{animation:pop .8s}
@keyframes pop{0%{transform:scale(.2) rotate(-40deg)}70%{transform:scale(1.3)}100%{transform:none}}
.newline{background:#fbf3df;border-left:5px solid #c9a24a;margin:10px 0;padding:10px 14px;font-size:1.15rem;border-radius:8px}
.wchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.chip{border:2px solid #cdd9e4;background:#fff;border-radius:999px;padding:4px 12px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
/* 보상 탑 */
.fin{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}.tw{flex:0 0 320px;max-width:100%}.tower{width:100%;height:auto;border-radius:16px;display:block}
.fside{flex:1;min-width:240px}.fside .cnt{font-size:1.15rem}
.chest .clid{transform-origin:0 20px;transition:transform .7s}.fin.opened .chest .clid{transform:rotate(-50deg)}
.fin.opened .spark{animation:spark 1.2s ease-out 2}
@keyframes spark{0%{opacity:0;transform:scale(.6)}40%{opacity:1}100%{opacity:0;transform:scale(1.2)}}
.spark{transform-origin:center;transform-box:fill-box}
.tbx.off text{fill:#9aa6c4}
.cert{border:4px double #c9a24a;background:#fffdf0;border-radius:14px;padding:14px 18px;text-align:center;margin-top:10px}
.cert small{font-family:"Jua",sans-serif;color:#8a6a45;font-size:1rem}.cert h3{font-size:1.6rem;margin:.1em 0}
/* 겹창 */
#modal{position:fixed;inset:0;background:rgba(20,24,35,.55);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
#modal.on{display:flex}
.mbox{background:var(--paper);border-radius:18px;max-width:620px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}.mbox.wide{max-width:900px}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}.mhd h2{margin:0}
.mhd .x{border:0;background:#eee;border-radius:10px;width:40px;height:40px;cursor:pointer;font-size:1.1rem}
.mbd{padding:12px 18px 18px}
.me-pop{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#2b3a55;color:#fff;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#warp{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#3b4f8a,#121a33);color:#fff}
#warp.on{display:flex}#warp .wc{animation:spin 1.2s linear infinite}#warp .wy{font-family:"Jua",sans-serif;font-size:3.4rem;margin-top:10px}#warp .wt{opacity:.8}
@keyframes spin{to{transform:rotate(360deg)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:65;display:none;overflow:hidden}#fx.on{display:block}
#fx i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.snow{animation:snow 6s linear infinite}@keyframes snow{to{transform:translateY(30px)}}
.teachBtn{border:0;background:none;color:var(--sub);text-decoration:underline;cursor:pointer;font-size:.85rem;margin-top:14px}
.teach h3{margin-bottom:0}
@media (max-width:760px){
  .mgrid{grid-template-columns:1fr}.cards,.slots{grid-template-columns:1fr}.opts.g2{grid-template-columns:1fr}
  .wrow{grid-template-columns:1fr}.talk .pf{flex-basis:64px}.talk .pf svg{width:64px;height:64px}
  .scene .scn{height:180px}.era{font-size:1.05rem;max-width:90%}.ttl{font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ttl small{display:none}.pc{display:none}#top .me span{display:none}
  .sort .it{grid-template-columns:1fr 1fr}.sort .it span{grid-column:1/3}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="top"></header>
<main id="view"></main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal"></div>
<div id="warp" aria-hidden="true"></div>
<div id="fx" aria-hidden="true"></div>

<script src="data.js"></script>
<script src="art.js"></script>
<script src="app.js"></script>
</body>
</html>
